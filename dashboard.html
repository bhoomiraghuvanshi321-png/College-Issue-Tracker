<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Campus Issue Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        body { background-color: var(--bg-color); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-mortarboard-fill text-warning"></i> 
                Campus Tracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <span class="nav-link text-light">Welcome, <strong id="userName">User</strong></span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="utils.logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container dashboard-layout">
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h2 class="fw-bold mb-0">My Dashboard</h2>
                <p class="text-muted">Overview of your recent activity</p>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <a href="create_ticket.html" class="btn btn-primary-custom">
                    <i class="bi bi-plus-circle me-2"></i> Raise New Ticket
                </a>
            </div>
        </div>

        <!-- Overview Cards -->
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="glass-card p-4 d-flex align-items-center">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                        <i class="bi bi-ticket-detailed"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.8rem;">Total Raised</h6>
                        <h3 class="mb-0 fw-bold" id="totalCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card p-4 d-flex align-items-center border-bottom border-warning border-4">
                    <div class="bg-warning text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                        <i class="bi bi-hourglass-split"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.8rem;">Pending / Progress</h6>
                        <h3 class="mb-0 fw-bold" id="activeCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="glass-card p-4 d-flex align-items-center border-bottom border-success border-4">
                    <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <div>
                        <h6 class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.8rem;">Resolved</h6>
                        <h3 class="mb-0 fw-bold" id="resolvedCount">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tickets Table -->
        <div class="glass-card p-0 overflow-hidden fade-in" style="animation-delay: 0.2s;">
            <div class="bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold"><i class="bi bi-list-ul me-2 text-primary"></i>My Recent Tickets</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadTickets()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light text-muted" style="font-size: 0.85rem; text-transform: uppercase;">
                        <tr>
                            <th class="ps-4">Ticket ID</th>
                            <th>Title & Department</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th class="text-end pe-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsBody">
                        <!-- Loading State -->
                        <tr>
                            <td colspan="6" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="text-muted mt-2 mb-0">Loading your tickets...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!utils.checkAuth()) return;
            const user = utils.getUser();
            document.getElementById('userName').textContent = user.name;
            loadTickets();
        });

        const getStatusBadgeClass = (status) => {
            switch(status) {
                case 'Pending': return 'badge-pending';
                case 'In Review': return 'badge-review';
                case 'In Progress': return 'badge-progress';
                case 'Resolved': return 'badge-resolved';
                case 'Rejected': return 'badge-rejected';
                default: return 'bg-secondary';
            }
        };

        const getPriorityClass = (priority) => {
            switch(priority) {
                case 'Low': return 'priority-low';
                case 'Medium': return 'priority-medium';
                case 'High': return 'priority-high';
                case 'Urgent': return 'priority-urgent';
                default: return 'text-muted';
            }
        };

        async function loadTickets() {
            try {
                const tickets = await api.getTickets();
                const tbody = document.getElementById('ticketsBody');
                
                // Update stats
                document.getElementById('totalCount').textContent = tickets.length;
                document.getElementById('activeCount').textContent = tickets.filter(t => ['Pending', 'In Review', 'In Progress'].includes(t.status)).length;
                document.getElementById('resolvedCount').textContent = tickets.filter(t => t.status === 'Resolved').length;

                if (tickets.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center py-5">
                                <div class="text-muted">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    No tickets found. Raise a new ticket to get started.
                                </div>
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = '';
                tickets.forEach(t => {
                    const row = document.createElement('tr');
                    
                    row.innerHTML = `
                        <td class="ps-4 fw-medium text-primary">#TKT-${t.id.toString().padStart(4, '0')}</td>
                        <td>
                            <div class="fw-bold">${t.title}</div>
                            <small class="text-muted"><i class="bi bi-building me-1"></i>${t.department_name}</small>
                        </td>
                        <td><span class="${getPriorityClass(t.priority)}"><i class="bi bi-circle-fill" style="font-size: 0.5rem; vertical-align: middle; margin-right: 4px;"></i>${t.priority}</span></td>
                        <td><span class="badge rounded-pill px-3 py-2 ${getStatusBadgeClass(t.status)}">${t.status}</span></td>
                        <td><small class="text-muted">${utils.formatDate(t.created_at)}</small></td>
                        <td class="text-end pe-4">
                            <a href="ticket_details.html?id=${t.id}" class="btn btn-sm btn-light border shadow-sm">View <i class="bi bi-arrow-right ms-1"></i></a>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
