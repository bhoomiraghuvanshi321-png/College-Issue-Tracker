<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - Campus Issue Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        body { background-color: var(--bg-color); }
        .timeline-container { position: relative; padding-left: 2rem; }
        .timeline-container::before { content: ''; position: absolute; left: 0.5rem; top: 0; bottom: 0; width: 2px; background-color: #e5e7eb; }
        .comment-item { position: relative; margin-bottom: 2rem; }
        .comment-item::before { content: ''; position: absolute; left: -2rem; top: 0.25rem; width: 1rem; height: 1rem; border-radius: 50%; background-color: var(--primary-color); border: 3px solid white; box-shadow: 0 0 0 2px var(--primary-color); z-index: 2; }
        .comment-item.system::before { background-color: var(--secondary-color); box-shadow: 0 0 0 2px var(--secondary-color); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#" id="homeLink">
                <i class="bi bi-mortarboard-fill text-warning"></i> 
                Campus Tracker
            </a>
            <div class="d-flex align-items-center">
                <a href="#" id="backLink" class="btn btn-outline-light btn-sm rounded-pill px-3 me-2"><i class="bi bi-arrow-left me-1"></i> Back</a>
            </div>
        </div>
    </nav>

    <div class="container dashboard-layout">
        <div id="loadingState" class="text-center py-5">
            <div class="spinner-border text-primary shadow" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h4 class="mt-3 text-muted">Loading Ticket Data...</h4>
        </div>

        <div id="ticketContent" class="d-none">
            <!-- Header section -->
            <div class="d-flex justify-content-between align-items-sm-center flex-column flex-sm-row mb-4">
                <div>
                    <h2 class="fw-bold mb-1" id="ticketTitle">Ticket Title</h2>
                    <p class="text-muted mb-0">
                        <span id="ticketId" class="badge bg-light text-dark border me-2 py-1 px-2"></span>
                        Raised by <strong id="ticketAuthor"></strong> on <span id="ticketDate"></span>
                    </p>
                </div>
                <!-- Admin Actions Panel -->
                <div id="adminPanel" class="d-none mt-3 mt-sm-0 glass-card p-3 shadow-sm border-0 bg-white">
                    <label class="form-label mb-1 fw-bold text-primary small text-uppercase">Update Status</label>
                    <div class="input-group input-group-sm">
                        <select class="form-select fw-semibold" id="statusSelect">
                            <option value="Pending">Pending</option>
                            <option value="In Review">In Review</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                        <button class="btn btn-primary-custom px-3 py-1" onclick="updateStatus()"><i class="bi bi-check2"></i> Save</button>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Left Column (Details) -->
                <div class="col-lg-4 order-lg-2">
                    <div class="glass-card p-4 sticky-top" style="top: 100px;">
                        <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-info-circle me-2 text-primary"></i>Information</h5>
                        
                        <div class="mb-3">
                            <small class="text-muted d-block text-uppercase fw-semibold mb-1">Status</small>
                            <span id="ticketStatus" class="badge rounded-pill px-3 py-2 fs-6 shadow-sm"></span>
                        </div>
                        
                        <div class="mb-3">
                            <small class="text-muted d-block text-uppercase fw-semibold mb-1">Priority</small>
                            <span id="ticketPriority" class="fs-6"><i class="bi bi-circle-fill me-2" style="font-size: 0.6rem; vertical-align: middle;"></i></span>
                        </div>
                        
                        <div class="mb-3">
                            <small class="text-muted d-block text-uppercase fw-semibold mb-1">Department</small>
                            <p class="mb-0 fw-medium bg-light p-2 rounded border" id="ticketDept">
                                <i class="bi bi-building text-primary me-2"></i>
                            </p>
                        </div>

                        <div id="attachmentSection" class="mb-3 d-none">
                            <small class="text-muted d-block text-uppercase fw-semibold mb-1">Attachment</small>
                            <a id="ticketAttachment" href="#" target="_blank" class="btn btn-sm btn-outline-primary w-100 d-flex align-items-center justify-content-center">
                                <i class="bi bi-paperclip me-2" style="font-size: 1.2rem;"></i> View Attached File
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Right Column (Description and Comments) -->
                <div class="col-lg-8 order-lg-1">
                    <!-- Description -->
                    <div class="glass-card p-4 mb-4">
                        <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-text-left me-2 text-primary"></i>Description</h5>
                        <p id="ticketDesc" class="mb-0 text-dark" style="white-space: pre-wrap; line-height: 1.6;"></p>
                    </div>

                    <!-- Timeline / Comments -->
                    <div class="glass-card p-4">
                        <h5 class="fw-bold border-bottom pb-2 mb-4"><i class="bi bi-chat-dots me-2 text-primary"></i>Discussion & Timeline</h5>
                        
                        <div class="timeline-container px-2 mb-5" id="commentsContainer">
                            <!-- Comments injected here -->
                        </div>

                        <!-- Add Comment form -->
                        <div class="bg-light p-4 rounded-3 border">
                            <h6 class="fw-bold mb-3">Add a Comment</h6>
                            <form id="commentForm">
                                <div class="mb-3">
                                    <textarea class="form-control" id="commentContent" rows="3" placeholder="Type your message here..." required></textarea>
                                </div>
                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                    <div>
                                        <input type="file" class="form-control form-control-sm" id="commentFile" style="max-width: 250px;">
                                    </div>
                                    <button type="submit" class="btn btn-primary-custom px-4 d-flex align-items-center gap-2">
                                        <span id="commentBtnText">Post Comment</span>
                                        <div id="commentSpinner" class="spinner-border spinner-border-sm d-none" role="status"></div>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        let ticketId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!utils.checkAuth()) return;
            const user = utils.getUser();
            
            // Setup links
            const isDash = user.role === 'DeptAdmin' || user.role === 'SubDeptAdmin' ? 'admin_dashboard.html' : 'dashboard.html';
            document.getElementById('homeLink').href = isDash;
            document.getElementById('backLink').href = isDash;

            // Get Ticket ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            ticketId = urlParams.get('id');
            
            if (!ticketId) {
                window.location.href = isDash;
                return;
            }

            // Show admin panel if admin
            if (user.role === 'DeptAdmin' || user.role === 'SubDeptAdmin') {
                document.getElementById('adminPanel').classList.remove('d-none');
            }

            await loadTicketDetails();
        });

        const getStatusBadgeClass = (status) => {
            switch(status) {
                case 'Pending': return 'badge-pending';
                case 'In Review': return 'badge-review';
                case 'In Progress': return 'badge-progress';
                case 'Resolved': return 'badge-resolved';
                case 'Rejected': return 'badge-rejected';
                default: return 'bg-secondary';
            }
        };

        const getPriorityColor = (priority) => {
            switch(priority) {
                case 'Low': return 'text-success';
                case 'Medium': return 'text-info';
                case 'High': return 'text-warning';
                case 'Urgent': return 'text-danger';
                default: return 'text-muted';
            }
        };

        async function loadTicketDetails() {
            try {
                const ticket = await api.getTicket(ticketId);
                
                // Populate UI
                document.getElementById('ticketTitle').textContent = ticket.title;
                document.getElementById('ticketId').textContent = `#TKT-${ticket.id.toString().padStart(4, '0')}`;
                document.getElementById('ticketAuthor').textContent = ticket.author_name;
                document.getElementById('ticketDate').textContent = utils.formatDate(ticket.created_at);
                
                const statusBadge = document.getElementById('ticketStatus');
                statusBadge.textContent = ticket.status;
                statusBadge.className = `badge rounded-pill px-3 py-2 fs-6 shadow-sm ${getStatusBadgeClass(ticket.status)}`;
                
                // Set admin dropdown to current status if admin panel is active
                const statusSelect = document.getElementById('statusSelect');
                if (statusSelect) statusSelect.value = ticket.status;

                const prioEl = document.getElementById('ticketPriority');
                prioEl.innerHTML = `<i class="bi bi-circle-fill me-2 ${getPriorityColor(ticket.priority)}" style="font-size: 0.6rem; vertical-align: middle;"></i><span class="fw-bold ${getPriorityColor(ticket.priority)}">${ticket.priority}</span>`;
                
                document.getElementById('ticketDept').innerHTML = `<i class="bi bi-building text-primary me-2"></i>${ticket.department_name}${ticket.sub_department_name ? ` <i class="bi bi-arrow-right mx-1 text-muted"></i> ${ticket.sub_department_name}` : ''}`;
                document.getElementById('ticketDesc').textContent = ticket.description;

                // Attachment
                if (ticket.file_path) {
                    const attachSec = document.getElementById('attachmentSection');
                    const attachLink = document.getElementById('ticketAttachment');
                    attachLink.href = `http://localhost:5000/api/tickets/uploads/${ticket.file_path}`;
                    attachSec.classList.remove('d-none');
                }

                // Initial creation timeline entry
                renderComments(ticket.comments, ticket);

                document.getElementById('loadingState').classList.add('d-none');
                document.getElementById('ticketContent').classList.remove('d-none');
                document.getElementById('ticketContent').classList.add('fade-in');

            } catch (err) {
                document.getElementById('loadingState').innerHTML = `
                    <div class="text-danger mb-3"><i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i></div>
                    <h4 class="text-danger">Failed to load ticket</h4>
                    <p class="text-muted">${err.message}</p>
                    <a href="dashboard.html" class="btn btn-outline-secondary mt-2">Return Dashboard</a>
                `;
            }
        }

        function renderComments(comments, ticket) {
            const container = document.getElementById('commentsContainer');
            container.innerHTML = '';

            // Render ticket creation
            const first = document.createElement('div');
            first.className = 'comment-item system';
            first.innerHTML = `
                <div class="bg-light p-3 rounded-3 border-start border-primary border-4 shadow-sm">
                    <p class="mb-1 fw-bold text-primary"><i class="bi bi-ticket-detailed me-1"></i> Ticket Raised</p>
                    <p class="mb-0 text-muted small">Submitted by ${ticket.author_name} on ${utils.formatDate(ticket.created_at)}</p>
                </div>
            `;
            container.appendChild(first);

            // Render custom comments
            comments.forEach(c => {
                const isSystem = !c.author_name; // basic check, could improve
                const bubble = document.createElement('div');
                bubble.className = `comment-item ${isSystem ? 'system' : ''}`;
                
                let fileHtml = '';
                if (c.file_path) {
                    fileHtml = `<div class="mt-3"><a href="http://localhost:5000/api/tickets/uploads/${c.file_path}" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-paperclip"></i> Attached File</a></div>`;
                }

                bubble.innerHTML = `
                    <div class="bg-white p-3 rounded-3 border shadow-sm">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="fw-bold">${c.author_name}</span>
                            <small class="text-muted">${utils.formatDate(c.created_at)}</small>
                        </div>
                        <p class="mb-0 text-dark" style="white-space: pre-wrap;">${c.content}</p>
                        ${fileHtml}
                    </div>
                `;
                container.appendChild(bubble);
            });
        }

        async function updateStatus() {
            const status = document.getElementById('statusSelect').value;
            const btn = document.querySelector('#adminPanel button');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            btn.disabled = true;

            try {
                await api.updateTicketStatus(ticketId, status);
                utils.showToast(`Status updated to ${status}`, 'success');
                // Reload ticket data to update UI globally
                await loadTicketDetails();
            } catch (err) {
                utils.showToast(err.message, 'error');
            } finally {
                btn.innerHTML = '<i class="bi bi-check2"></i> Save';
                btn.disabled = false;
            }
        }

        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('commentContent').value;
            const fileInput = document.getElementById('commentFile');

            const btnText = document.getElementById('commentBtnText');
            const spinner = document.getElementById('commentSpinner');
            const submitBtn = document.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            btnText.textContent = 'Posting...';
            spinner.classList.remove('d-none');

            const formData = new FormData();
            formData.append('content', content);
            if (fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            }

            try {
                await api.addComment(ticketId, formData);
                utils.showToast('Comment added', 'success');
                document.getElementById('commentContent').value = '';
                fileInput.value = '';
                await loadTicketDetails(); // reload to show comment
            } catch (err) {
                utils.showToast(err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Post Comment';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
