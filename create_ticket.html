<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise a Ticket - Campus Issue Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        body { background-color: var(--bg-color); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-mortarboard-fill text-warning"></i> 
                Campus Tracker
            </a>
            <div class="d-flex align-items-center">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill px-3 me-2"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container dashboard-layout">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card p-5 fade-in">
                    <h3 class="fw-bold mb-1"><i class="bi bi-plus-circle-fill text-primary me-2"></i>Raise a New Ticket</h3>
                    <p class="text-muted mb-4">Please provide detailed information about the issue so we can resolve it quickly.</p>

                    <form id="ticketForm">
                        <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>
                        
                        <div class="mb-4">
                            <label for="title" class="form-label fw-semibold">Issue Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg fs-6" id="title" placeholder="E.g., Wi-Fi not working in Library Sector C" required>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label for="department_id" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                <select class="form-select form-select-lg fs-6" id="department_id" required>
                                    <option value="" disabled selected>Select...</option>
                                    <!-- Populated via API -->
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="sub_department_id" class="form-label fw-semibold">Sub-Department</label>
                                <select class="form-select form-select-lg fs-6" id="sub_department_id">
                                    <option value="" selected>Select Dept first...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="priority" class="form-label fw-semibold">Priority <span class="text-danger">*</span></label>
                                <select class="form-select form-select-lg fs-6" id="priority" required>
                                    <option value="" disabled selected>Select...</option>
                                    <option value="Low" class="text-success fw-bold">Low</option>
                                    <option value="Medium" class="text-info fw-bold">Medium</option>
                                    <option value="High" class="text-warning fw-bold">High</option>
                                    <option value="Urgent" class="text-danger fw-bold">Urgent</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" rows="5" placeholder="Provide as much detail as possible..." required></textarea>
                        </div>
                        
                        <div class="mb-5">
                            <label class="form-label fw-semibold">Attachments (Optional)</label>
                            <div class="border rounded p-4 text-center bg-light" style="border-style: dashed !important; border-width: 2px !important; border-color: #ccc !important;">
                                <i class="bi bi-cloud-arrow-up text-primary" style="font-size: 2rem;"></i>
                                <p class="mt-2 mb-2 fw-medium">Drag & drop files or click to browse</p>
                                <p class="text-muted small mb-3">Supported formats: JPG, PNG, PDF, DOCX (Max 16MB)</p>
                                <input type="file" class="form-control w-75 mx-auto" id="file" accept=".png,.jpg,.jpeg,.pdf,.doc,.docx">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 border-top pt-4">
                            <a href="dashboard.html" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-5 d-flex align-items-center gap-2">
                                <span id="btnText">Submit Ticket</span>
                                <div id="spinner" class="spinner-border spinner-border-sm d-none" role="status"></div>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!utils.checkAuth()) return;

            // Load departments
            try {
                const depts = await api.getDepartments();
                const select = document.getElementById('department_id');
                depts.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Failed to load departments', err);
            }
        });

        document.getElementById('department_id').addEventListener('change', async (e) => {
            const deptId = e.target.value;
            const subSelect = document.getElementById('sub_department_id');
            subSelect.innerHTML = '<option value="" selected>Loading...</option>';
            
            try {
                const subDepts = await api.getSubDepartments(deptId);
                subSelect.innerHTML = '<option value="" selected>Select (Optional)</option>';
                subDepts.forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub.id;
                    opt.textContent = sub.name;
                    subSelect.appendChild(opt);
                });
            } catch (err) {
                subSelect.innerHTML = '<option value="" selected>None found</option>';
            }
        });

        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.querySelector('button[type="submit"]');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            
            errorMsg.classList.add('d-none');
            submitBtn.disabled = true;
            btnText.textContent = 'Submitting...';
            spinner.classList.remove('d-none');
            
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('department_id', document.getElementById('department_id').value);
            
            const subDept = document.getElementById('sub_department_id').value;
            if (subDept) formData.append('sub_department_id', subDept);
            
            formData.append('priority', document.getElementById('priority').value);
            
            const fileInput = document.getElementById('file');
            if (fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            }
            
            try {
                const res = await api.createTicket(formData);
                utils.showToast('Ticket created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('d-none');
                submitBtn.disabled = false;
                btnText.textContent = 'Submit Ticket';
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
