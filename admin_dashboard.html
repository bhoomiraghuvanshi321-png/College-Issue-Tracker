<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Campus Issue Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        body { background-color: var(--bg-color); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="admin_dashboard.html">
                <i class="bi bi-shield-shaded text-warning"></i> 
                Admin Portal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <span class="nav-link text-light">Admin: <strong id="userName" class="text-warning">User</strong></span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="utils.logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 dashboard-layout">
        <div class="row">
            <!-- Sidebar Filters -->
            <div class="col-lg-3 mb-4">
                <div class="glass-card p-4 sticky-top" style="top: 100px; z-index: 10;">
                    <h5 class="fw-bold mb-4"><i class="bi bi-funnel me-2"></i>Filters</h5>
                    
                    <form id="filterForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted text-uppercase" style="font-size: 0.8rem;">Status</label>
                            <select class="form-select shadow-sm" id="filterStatus">
                                <option value="">All Statuses</option>
                                <option value="Pending">Pending</option>
                                <option value="In Review">In Review</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Resolved">Resolved</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted text-uppercase" style="font-size: 0.8rem;">Priority</label>
                            <select class="form-select shadow-sm" id="filterPriority">
                                <option value="">All Priorities</option>
                                <option value="Urgent">Urgent</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-muted text-uppercase" style="font-size: 0.8rem;">Department</label>
                            <select class="form-select shadow-sm" id="filterDept">
                                <option value="">All My Departments</option>
                                <!-- Populate via JS if Admin can see multiple, otherwise lock to their dept -->
                            </select>
                        </div>
                        
                        <button type="button" class="btn btn-primary-custom w-100" onclick="applyFilters()">
                            Apply Filters
                        </button>
                        <button type="button" class="btn btn-light w-100 mt-2 border shadow-sm" onclick="clearFilters()">
                            Clear Filters
                        </button>
                    </form>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9">
                <!-- Overview Stats -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="glass-card p-3 text-center">
                            <h3 class="fw-bold text-primary mb-0" id="statTotal">0</h3>
                            <small class="text-muted fw-semibold text-uppercase">Total Tickets</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="glass-card p-3 text-center border-bottom border-danger border-3">
                            <h3 class="fw-bold text-danger mb-0" id="statUrgent">0</h3>
                            <small class="text-muted fw-semibold text-uppercase">Urgent</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="glass-card p-3 text-center border-bottom border-warning border-3">
                            <h3 class="fw-bold text-warning mb-0" id="statPending">0</h3>
                            <small class="text-muted fw-semibold text-uppercase">Pending</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="glass-card p-3 text-center border-bottom border-success border-3">
                            <h3 class="fw-bold text-success mb-0" id="statResolved">0</h3>
                            <small class="text-muted fw-semibold text-uppercase">Resolved</small>
                        </div>
                    </div>
                </div>

                <!-- Tickets List -->
                <div class="glass-card p-0 overflow-hidden fade-in">
                    <div class="bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-inbox me-2 text-primary"></i>Department Queue</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadTickets()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-light text-muted" style="font-size: 0.85rem; text-transform: uppercase;">
                                <tr>
                                    <th class="ps-4">Ticket ID</th>
                                    <th>Title & Student</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th class="text-end pe-4">Manage</th>
                                </tr>
                            </thead>
                            <tbody id="ticketsBody">
                                <tr>
                                    <td colspan="6" class="text-center py-5">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        let allTickets = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!utils.checkAuth()) return;
            const user = utils.getUser();
            if (user.role !== 'DeptAdmin' && user.role !== 'SubDeptAdmin') {
                window.location.href = 'dashboard.html';
                return;
            }
            document.getElementById('userName').textContent = user.name + ` (${user.role})`;

            // Load departments for filter
            try {
                const depts = await api.getDepartments();
                const select = document.getElementById('filterDept');
                depts.forEach(d => {
                    // Logic constraint: Admin shouldn't really see other depts unless system-level 
                    // But we'll add them to the select box
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = d.name;
                    select.appendChild(opt);
                });
            } catch (err) {}

            loadTickets();
        });

        const getStatusBadgeClass = (status) => {
            switch(status) {
                case 'Pending': return 'badge-pending';
                case 'In Review': return 'badge-review';
                case 'In Progress': return 'badge-progress';
                case 'Resolved': return 'badge-resolved';
                case 'Rejected': return 'badge-rejected';
                default: return 'bg-secondary';
            }
        };

        const getPriorityClass = (priority) => {
            switch(priority) {
                case 'Low': return 'priority-low';
                case 'Medium': return 'priority-medium';
                case 'High': return 'priority-high';
                case 'Urgent': return 'priority-urgent';
                default: return 'text-muted';
            }
        };

        async function loadTickets(filters = {}) {
            try {
                const tickets = await api.getTickets(filters);
                allTickets = tickets; // Cache for stats
                renderTickets(tickets);
                updateStats(tickets);
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        }

        function renderTickets(tickets) {
            const tbody = document.getElementById('ticketsBody');
            if (tickets.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="text-muted">
                                <i class="bi bi-check-circle fs-1 d-block mb-2 text-success"></i>
                                Queue is empty. Great job!
                            </div>
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = '';
            tickets.forEach(t => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="ps-4 fw-medium text-primary">#TKT-${t.id.toString().padStart(4, '0')}</td>
                    <td>
                        <div class="fw-bold text-truncate" style="max-width: 250px;" title="${t.title}">${t.title}</div>
                        <small class="text-muted"><i class="bi bi-person me-1"></i>${t.author_name || 'User'} | ${t.department_name}</small>
                    </td>
                    <td><span class="${getPriorityClass(t.priority)}"><i class="bi bi-circle-fill" style="font-size: 0.5rem; vertical-align: middle; margin-right: 4px;"></i>${t.priority}</span></td>
                    <td><span class="badge rounded-pill px-3 py-2 ${getStatusBadgeClass(t.status)}">${t.status}</span></td>
                    <td><small class="text-muted">${utils.formatDate(t.created_at)}</small></td>
                    <td class="text-end pe-4">
                        <a href="ticket_details.html?id=${t.id}" class="btn btn-sm btn-primary-custom px-3">Review</a>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStats(tickets) {
            document.getElementById('statTotal').textContent = tickets.length;
            document.getElementById('statUrgent').textContent = tickets.filter(t => t.priority === 'Urgent').length;
            document.getElementById('statPending').textContent = tickets.filter(t => t.status === 'Pending').length;
            document.getElementById('statResolved').textContent = tickets.filter(t => t.status === 'Resolved').length;
        }

        function applyFilters() {
            const status = document.getElementById('filterStatus').value;
            const priority = document.getElementById('filterPriority').value;
            const dept = document.getElementById('filterDept').value;
            
            const filters = {};
            if (status) filters.status = status;
            if (priority) filters.priority = priority;
            if (dept) filters.department_id = dept;
            
            loadTickets(filters);
        }

        function clearFilters() {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterPriority').value = '';
            document.getElementById('filterDept').value = '';
            loadTickets();
        }
    </script>
</body>
</html>
